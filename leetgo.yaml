# leetgo configuration: https://github.com/j178/leetgo
#   leetgo pick 150          # fetch problem: solution.py, testcases.txt, question.md
#   leetgo test last -L      # run examples locally (or: pytest / bazel test)
#   leetgo submit last       # submit the code between the @lc markers
author: Kshitij Patil
language: en
code:
  lang: python3
  filename_template: '{{ .Id | padWithZero 4 }}{{ if .SlugIsMeaningful }}.{{ .Slug }}{{ end }}'
  separate_description_file: true
  modifiers:
    - name: removeUselessComments
  python3:
    out_dir: leetcode-python
    # Must match the Bazel toolchain and the root .venv (bazel/python/python.MODULE.bazel).
    executable: python3.14
leetcode:
  site: https://leetcode.com
  credentials:
    # Reads your LeetCode session cookies from the browser you're logged in with.
    from:
      - browser
    browsers: []
editor:
  use: custom
  command: idea
  args: '{{.CodeFile}}'
